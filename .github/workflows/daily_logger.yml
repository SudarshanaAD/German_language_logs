name: Generate Daily Duolingo Logs
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-and-log:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v3

    - name: Set up Python environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install required HTTP library
      run: pip install requests

    - name: Execute log generator script
      run: python fetch_duolingo.py

    - name: Commit and push changes back to main branch
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        mkdir -p German_language_logs
        git add .
        git diff-index --quiet HEAD || (git commit -m "Auto-generated log for $(date +'%Y-%m-%d')" && git push)
    - name: Push stats to profile repo
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git clone https://x-access-token:${{ secrets.PROFILE_TOKEN }}@github.com/SudarshanaAD/SudarshanaAD.git profile-repo
        cp README.md profile-repo/README.md   # copy updated root README into profile repo
        cd profile-repo
        git add README.md
        git commit -m "Update Duolingo stats from German_language_logs workflow" || echo "No changes to commit"
        git push
