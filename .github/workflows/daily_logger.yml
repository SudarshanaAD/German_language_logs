name: Generate Daily Duolingo Logs
on:
  schedule:
    - cron: '0 0 * * *' # Triggers automatically every midnight
  workflow_dispatch: # Allows you to manually click "Run workflow" to test it

jobs:
  build-and-log:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v3

    - name: Set up Python environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Duolingo API dependencies
      run: pip install duolingo-api

    - name: Execute log generator script
      env:
        DUOLINGO_USERNAME: ${{ secrets.DUOLINGO_USERNAME }}
        DUOLINGO_PASSWORD: ${{ secrets.DUOLINGO_PASSWORD }}
      run: python fetch_duolingo.py

    - name: Commit and push changes back to main branch
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add German_language_logs/
        git diff-index --quiet HEAD || (git commit -m "Auto-generated log for $(date +'%Y-%m-%d')" && git push)
